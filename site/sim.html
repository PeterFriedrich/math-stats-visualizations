<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation · Math and Stats Visualization</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='18' width='6' height='11' fill='%232459c9'/%3E%3Crect x='13' y='5' width='6' height='24' fill='%232459c9'/%3E%3Crect x='23' y='12' width='6' height='17' fill='%232459c9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./">Math and Stats Visualization <span>· Math 20-1, Math 30 &amp; STAT 151</span></a>
      <nav class="crumbs"><a href="./">All simulations</a></nav>
    </div>
  </header>
  <main class="wrap" id="sim-root">
    <section class="sim-title">
      <div class="badge" id="sim-badge"></div>
      <h1 id="sim-heading">Loading…</h1>
      <p id="sim-summary"></p>
    </section>
    <div class="sim-layout">
      <section class="stage">
        <canvas id="sim-canvas" aria-label="Simulation view"></canvas>
        <div class="legend" id="sim-legend"></div>
        <div class="transport" id="sim-transport"></div>
        <div class="steps" id="sim-steps" hidden></div>
      </section>
      <aside class="panel">
        <div id="sim-controls" class="panel"></div>
        <fieldset class="group"><legend>Readouts</legend><div id="sim-readouts"></div></fieldset>
      </aside>
    </div>
    <section class="notes">
      <div class="note"><h2>Key equations</h2><ul class="eq-list" id="sim-equations"></ul></div>
      <div class="note"><h2>Try this</h2><ol id="sim-prompts"></ol></div>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap">Built for tutoring. Not affiliated with Alberta Education or the University of Alberta.</div></footer>
  <script type="module" src="js/sim-page.js"></script>
</body>
</html>
